name: Desplegar en DEV

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Hacer checkout del código del repositorio (aunque luego clonaremos en el VPS)
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      # 2. Configurar el agente SSH con la clave privada (para conectarte al VPS)
      - name: Configurar agente SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Conectarse al VPS y clonar (o actualizar) el repositorio, reiniciar contenedores y ejecutar migraciones
      - name: Desplegar en el VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_DOMAIN }} << 'EOF'
            set -e
            # Definir la ruta base donde desplegarás la aplicación
            DEPLOY_DIR="${{ secrets.REPO_LOCATION }}"
            REPO_DIR="${DEPLOY_DIR}/${{ secrets.DEPLOY_FOLDER_NAME }}"

            cd "$DEPLOY_DIR"

            # Si no existe el directorio del repositorio, clónalo; si ya existe, actualízalo
            if [ ! -d "${{ secrets.DEPLOY_FOLDER_NAME }}" ] || ! git -C "${{ secrets.DEPLOY_FOLDER_NAME }}" rev-parse --is-inside-work-tree > /dev/null 2>&1; then
              echo "El directorio no existe o no es un repositorio Git."
              echo "Eliminando directorio y clonando..."
              rm -rf ${{ secrets.DEPLOY_FOLDER_NAME }}
              git clone https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/ClownsTech/enrollfun-backend.git ${{ secrets.DEPLOY_FOLDER_NAME }}
            fi

            echo "Repositorio encontrado. Actualizando..."
            cd ${{ secrets.DEPLOY_FOLDER_NAME }}
            git fetch --all
            git checkout DEV
            git pull origin DEV
            git reset --hard origin/DEV
            
            echo "Construyendo y reiniciando contenedores con docker-compose..."
            docker-compose down
            docker-compose up -d --build

            echo "Ejecutando migraciones con Alembic..."
            # Se asume que el contenedor que ejecuta la API se llama 'app'
            docker exec app flask db upgrade

            echo "Despliegue completado exitosamente."
          EOF
